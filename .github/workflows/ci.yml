name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI uses only the synthetic fixtures; the loop library and SoundFonts never leave the local machine.
jobs:
  groom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: groom
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npx vitest --run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
