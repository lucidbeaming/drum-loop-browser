[project]
name = "groom"
version = "0.1.0"
description = "Offline analysis, normalising, tagging and grooming of a MIDI drum loop library"
authors = [
    { email = "zenphoto@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.1",
    "mido>=1.3.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "typer>=0.29.1",
]

[project.scripts]
groom = "groom.cli:app"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["groom"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mido", "mido.*", "soundfile", "librosa", "librosa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
